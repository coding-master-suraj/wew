<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my connection</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.75);
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-hover: #4f46e5;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --success: #10b981;
            --success-hover: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        h2 {
            text-align: center;
            margin: 5px 0 15px 0;
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .setup-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 900px;
            margin: 0 auto 15px auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-sizing: border-box;
            box-shadow: var(--shadow);
        }

        .code-box {
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            color: var(--text-muted);
            font-weight: 500;
        }

        .code-box span {
            color: #818cf8;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            font-size: clamp(1.2rem, 2.2vw, 1.4rem);
            letter-spacing: 3px;
            background: rgba(99, 102, 241, 0.12);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .connect-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
            max-width: 480px;
            justify-content: flex-end;
            align-items: center;
        }

        .connect-box input {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
            flex: 1;
            min-width: 130px;
            transition: all 0.3s;
        }

        .connect-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .connect-box select {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .connect-box select:focus {
            border-color: var(--accent);
        }

        .connect-box input:disabled, .connect-box select:disabled {
            background: #111827;
            cursor: not-allowed;
            opacity: 0.6;
        }

        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #374151;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .main-layout {
            display: flex;
            flex: 1;
            gap: 15px;
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .video-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .video-box {
            position: relative;
            background: #030712;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        .video-box:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .controls button {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            flex: 1;
            min-width: 120px;
            max-width: 160px;
            box-shadow: none;
        }

        .controls button:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .controls button.active {
            background: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        
        .controls button.speaker-normal {
            background: #f59e0b;
            border-color: #f59e0b;
        }

        .chat-section {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            overflow: hidden;
            height: fit-content;
        }

        .chat-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            background: rgba(3, 7, 18, 0.2);
        }

        .chat-messages {
            height: 140px; 
            max-height: 140px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13.5px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.2);
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 82%;
            word-break: break-word;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.incoming {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            align-self: flex-start;
            color: var(--text-main);
        }

        .message.outgoing {
            background: var(--accent-gradient);
            align-self: flex-end;
            color: white;
        }

        .file-msg-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-download-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .file-download-btn:hover {
            background: var(--success-hover);
        }

        .emoji-bar {
            display: flex;
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            gap: 8px;
            justify-content: center;
            background: rgba(3, 7, 18, 0.3);
        }

        .emoji-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none;
        }

        .emoji-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
        }

        .chat-input-area {
            display: flex;
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            gap: 10px;
            background: rgba(3, 7, 18, 0.5);
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            font-size: 13.5px;
            letter-spacing: normal;
            text-align: left;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .chat-input-area button {
            padding: 10px 16px;
            font-size: 13.5px;
        }

        .file-transfer-section {
            padding: 12px 14px 16px 14px;
            border-top: 1px solid var(--border);
            background: rgba(3, 7, 18, 0.6);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        .file-transfer-section label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .file-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .file-custom-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            transition: all 0.2s;
            text-align: center;
        }

        .file-custom-btn:hover {
            border-color: var(--accent);
        }

        .file-transfer-section button.send-action {
            padding: 8px 12px;
            font-size: 12px;
        }

        .progress-bar-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-gradient);
            transition: width 0.1s linear;
        }

        .transfer-status {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        #call-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 35px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 340px;
            width: 100%;
            animation: popUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .modal-content p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-accept {
            background: var(--success);
            padding: 12px 24px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-accept:hover {
            background: var(--success-hover);
        }

        .btn-reject {
            background: var(--danger);
            padding: 12px 24px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
        }
        .btn-reject:hover {
            background: var(--danger-hover);
        }

        #animation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
            20% { opacity: 1; transform: translateY(70vh) scale(1.4); }
            80% { opacity: 1; transform: translateY(30vh) scale(1.8); }
            100% { transform: translateY(-10vh) scale(2.2); opacity: 0; }
        }

        .floating-emoji {
            position: absolute;
            font-size: 3.5rem;
            animation: floatUp 4s ease-in-out forwards;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
            .chat-section {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="animation-overlay"></div>

    <div id="call-modal">
        <div class="modal-content">
            <h3 id="modal-title">Incoming Call</h3>
            <p>Code: <span id="caller-id-display" style="color: #818cf8; font-weight: bold; font-family: monospace;">----</span></p>
            <div class="modal-buttons">
                <button class="btn-reject" onclick="rejectCall()">Reject</button>
                <button class="btn-accept" onclick="acceptCall()">Accept</button>
            </div>
        </div>
    </div>

    <h2>Video/Audio Call & Chat/File Transfer</h2>
    
    <div class="setup-card">
        <div class="code-box">
            Your Code: <span id="my-code-display">----</span>
        </div>
        <div class="connect-box">
            <input type="text" id="remote-code-input" maxlength="4" placeholder="4-digit code">
            <select id="call-type-select">
                <option value="video">Video Call</option>
                <option value="audio">Audio Call</option>
            </select>
            <button id="connect-btn" onclick="connectToPeer()">Connect</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="video-section">
            <div class="video-grid" id="video-grid-container">
                <div class="video-box" id="local-box-wrapper">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="label" id="local-label">My Camera (Off)</div>
                </div>
                <div class="video-box" id="remote-box-wrapper">
                    <video id="remote-video" autoplay playsinline></video>
                    <div class="label" id="remote-label">Partner Camera</div>
                </div>
            </div>

            <div class="controls" id="controls-container"></div>
        </div>

        <div class="chat-section">
            <div class="chat-header">Live Chat & Reactions</div>
            <div id="chat-messages" class="chat-messages"></div>
            
            <div class="emoji-bar">
                <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
                <button class="emoji-btn" onclick="sendEmoji('😍')">😍</button>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>

            <!-- Enhanced File & Folder Transfer Panel -->
            <div class="file-transfer-section">
                <label>File / Folder Share</label>
                <div class="file-input-wrapper">
                    <input type="file" id="single-file-input" style="display:none" onchange="handleFileSelection(this.files[0])">
                    <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none" onchange="handleFolderSelection(this.files)">
                    
                    <button class="file-custom-btn" id="file-label-btn" onclick="document.getElementById('single-file-input').click()">Select File</button>
                    <button class="file-custom-btn" onclick="document.getElementById('folder-input').click()">Select Folder</button>
                    <button class="send-action" onclick="startSending()" id="send-file-btn" disabled>Send</button>
                </div>
                <div class="progress-bar-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="transfer-status" id="transfer-status"></div>
            </div>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

<script>
    let localStream = null;
    let blackVideoTrack = null;
    let peer = null;
    let conn = null;
    let currentCall = null;
    let pendingCall = null;
    let isCameraOn = false;
    let isMicMuted = false;
    let isLoudSpeaker = true;
    let usingFrontCamera = true;
    let activeCallMode = 'video';
    
    let filesQueue = [];
    let currentFileIndex = 0;
    let incomingFileMeta = null;
    let incomingFileBuffer = [];
    let receivedSize = 0;

    const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    function generate4DigitCode() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    const myId = generate4DigitCode();
    document.getElementById('my-code-display').innerText = myId;

    peer = new Peer(myId, {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    });

    peer.on('open', (id) => {
        console.log('My Peer ID:', id);
    });

    peer.on('call', (call) => {
        pendingCall = call;
        activeCallMode = call.metadata && call.metadata.type === 'audio' ? 'audio' : 'video';
        
        document.getElementById('caller-id-display').innerText = call.peer;
        document.getElementById('modal-title').innerText = activeCallMode === 'audio' ? 'Incoming Audio Call' : 'Incoming Video Call';
        document.getElementById('call-modal').style.display = 'flex';
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupConnectionEvents();
    });

    async function acceptCall() {
        document.getElementById('call-modal').style.display = 'none';
        if (!pendingCall) return;

        setupUIForMode(activeCallMode);
        const stream = await ensureLocalStream(activeCallMode === 'audio');
        if (!stream) return;
        pendingCall.answer(stream);
        setupCallEvents(pendingCall);
        lockUIOnConnect();
    }

    function rejectCall() {
        document.getElementById('call-modal').style.display = 'none';
        if (pendingCall) {
            pendingCall.close();
            pendingCall = null;
        }
    }

    async function connectToPeer() {
        const remoteId = document.getElementById('remote-code-input').value.trim();
        activeCallMode = document.getElementById('call-type-select').value;
        
        if (remoteId.length !== 4) return alert('Please enter a valid 4-digit code!');
        if (remoteId === myId) return alert('You cannot connect to yourself!');

        const stream = await ensureLocalStream(activeCallMode === 'audio');
        if (!stream) return;

        lockUIOnConnect();
        setupUIForMode(activeCallMode);

        conn = peer.connect(remoteId);
        setupConnectionEvents();

        const call = peer.call(remoteId, stream, {
            metadata: { type: activeCallMode }
        });
        setupCallEvents(call);
    }

    function setupUIForMode(mode) {
        const controls = document.getElementById('controls-container');
        const localBox = document.getElementById('local-box-wrapper');
        const remoteBox = document.getElementById('remote-box-wrapper');

        if (mode === 'audio') {
            localBox.style.display = 'none';
            remoteBox.style.display = 'none';
            
            controls.innerHTML = `
                <button id="mic-btn" onclick="toggleMic()">Mute Mic</button>
                <button id="speaker-btn" onclick="toggleSpeaker()">Speaker: Loud</button>
            `;
        } else {
            localBox.style.display = 'flex';
            remoteBox.style.display = 'flex';
            remoteBox.style.aspectRatio = '16/9';
            
            controls.innerHTML = `
                <button id="cam-btn" onclick="toggleCamera()">Turn Off Cam</button>
                <button id="switch-cam-btn" onclick="switchCamera()">Switch Cam</button>
                <button id="mic-btn" onclick="toggleMic()">Mute Mic</button>
                <button id="speaker-btn" onclick="toggleSpeaker()">Speaker: Loud</button>
            `;
        }
    }

    function setupCallEvents(call) {
        currentCall = call;
        
        call.on('stream', async (remoteStream) => {
            if (activeCallMode === 'video') {
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = remoteStream;
                applyAudioRouting(remoteVideo);

                // If the sender temporarily stops/changes video tracks,
                // force the element to repaint instead of retaining a stale frame.
                remoteStream.getVideoTracks().forEach(track => {
                    track.addEventListener('ended', () => {
                        if (remoteVideo.srcObject === remoteStream) {
                            remoteVideo.pause();
                            remoteVideo.srcObject = null;
                            remoteVideo.poster = '';
                        }
                    });
                });
                try {
                    await remoteVideo.play();
                } catch (e) {
                    console.log("Autoplay blocked, waiting for user interaction", e);
                }
            } else {
                const remoteAudio = document.getElementById('remote-audio');
                remoteAudio.srcObject = remoteStream;
                applyAudioRouting(remoteAudio);
                try {
                    await remoteAudio.play();
                } catch (e) {
                    console.log("Audio autoplay blocked", e);
                }
            }
        });
        
        call.on('close', () => {
            triggerDisconnect(false);
        });
    }

    function applyAudioRouting(element) {
        element.volume = isLoudSpeaker ? 1.0 : 0.35;
    }

    function lockUIOnConnect() {
        const connectBtn = document.getElementById('connect-btn');
        const remoteInput = document.getElementById('remote-code-input');
        const callTypeSelect = document.getElementById('call-type-select');
        
        connectBtn.innerText = "Disconnect";
        connectBtn.style.background = "var(--danger)";
        connectBtn.style.boxShadow = "0 4px 12px rgba(244, 63, 94, 0.4)";
        connectBtn.onclick = () => triggerDisconnect(true);
        remoteInput.disabled = true;
        callTypeSelect.disabled = true;
    }

    function resetUIAfterDisconnect() {
        const connectBtn = document.getElementById('connect-btn');
        const remoteInput = document.getElementById('remote-code-input');
        const callTypeSelect = document.getElementById('call-type-select');
        
        connectBtn.innerText = "Connect";
        connectBtn.style.background = "var(--accent-gradient)";
        connectBtn.style.boxShadow = "0 4px 12px rgba(99, 102, 241, 0.3)";
        connectBtn.onclick = connectToPeer;
        
        remoteInput.disabled = false;
        remoteInput.value = "";
        callTypeSelect.disabled = false;

        document.getElementById('controls-container').innerHTML = "";
        const localVideoEl = document.getElementById('local-video');
        const remoteVideoEl = document.getElementById('remote-video');

        localVideoEl.pause();
        remoteVideoEl.pause();

        localVideoEl.srcObject = null;
        remoteVideoEl.srcObject = null;
        document.getElementById('remote-audio').srcObject = null;
        
        document.getElementById('local-box-wrapper').style.display = 'flex';
        document.getElementById('remote-box-wrapper').style.display = 'flex';
        document.getElementById('local-label').innerText = "My Camera (Off)";

        isCameraOn = false;
        localStream = null;
        currentCall = null;
        conn = null;
    }

    async function ensureLocalStream(audioOnly = false) {
        if (localStream) return localStream;
        try {
            const constraints = audioOnly ? { video: false, audio: true } : { video: { facingMode: 'user' }, audio: true };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            if (!audioOnly) {
                const localVideo = document.getElementById('local-video');
                localVideo.srcObject = localStream;
                await localVideo.play();
                isCameraOn = true;
                document.getElementById('local-label').innerText = "My Camera";
            }
            return localStream;
        } catch (err) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const dst = oscillator.connect(audioCtx.createMediaStreamDestination());
            oscillator.start();
            localStream = dst.stream;
            return localStream;
        }
    }

    function setupConnectionEvents() {
        if (conn && conn.dataChannel) {
            conn.dataChannel.binaryType = 'arraybuffer';
        }

        conn.on('data', (data) => {
            if (data === '__DISCONNECT__') {
                triggerDisconnect(false); 
            } else if (typeof data === 'object' && data !== null && data.type === 'emoji') {
                triggerEmojiAnimation(data.emoji);
                appendMessage(`${data.emoji}`, 'incoming');
            } else if (typeof data === 'object' && data !== null && data.type === 'file-meta') {
                incomingFileMeta = data;
                incomingFileBuffer = [];
                receivedSize = 0;
                document.getElementById('progress-container').style.display = 'block';
                document.getElementById('transfer-status').innerText = `Receiving 0% (${incomingFileMeta.name})`;
            } else if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
                const chunk = data instanceof ArrayBuffer ? data : data.buffer;
                incomingFileBuffer.push(chunk);
                receivedSize += chunk.byteLength;

                if (incomingFileMeta) {
                    const progress = Math.min(100, Math.round((receivedSize / incomingFileMeta.size) * 100));
                    document.getElementById('progress-bar').style.width = progress + '%';
                    document.getElementById('transfer-status').innerText = `Receiving ${progress}%`;

                    if (receivedSize >= incomingFileMeta.size) {
                        const completeBlob = new Blob(incomingFileBuffer, { type: incomingFileMeta.fileType || 'application/octet-stream' });
                        const downloadUrl = URL.createObjectURL(completeBlob);
                        
                        const autoLink = document.createElement('a');
                        autoLink.href = downloadUrl;
                        autoLink.download = incomingFileMeta.name || 'downloaded-file';
                        document.body.appendChild(autoLink);
                        autoLink.click();
                        setTimeout(() => {
                            document.body.removeChild(autoLink);
                        }, 1000);

                        appendFileDownloadMessage(incomingFileMeta.name, downloadUrl);

                        document.getElementById('transfer-status').innerText = `Completed: ${incomingFileMeta.name}`;
                        incomingFileMeta = null;
                        incomingFileBuffer = [];
                    }
                }
            } else if (typeof data === 'string') {
                appendMessage(data, 'incoming');
            }
        });

        conn.on('close', () => {
            triggerDisconnect(false);
        });
    }

    function handleFileSelection(file) {
        if (!file) return;
        filesQueue = [file];
        document.getElementById('file-label-btn').innerText = file.name;
        document.getElementById('send-file-btn').disabled = false;
    }

    function handleFolderSelection(fileList) {
        if (!fileList || fileList.length === 0) return;
        filesQueue = Array.from(fileList);
        document.getElementById('file-label-btn').innerText = `Folder (${filesQueue.length} files)`;
        document.getElementById('send-file-btn').disabled = false;
    }

    function startSending() {
        if (filesQueue.length === 0 || !conn || !conn.open) {
            alert('Please select a file or folder and check your connection!');
            return;
        }
        currentFileIndex = 0;
        document.getElementById('send-file-btn').disabled = true;
        document.getElementById('progress-container').style.display = 'block';
        sendNextFileInQueue();
    }

    function sendNextFileInQueue() {
        if (currentFileIndex >= filesQueue.length) {
            document.getElementById('transfer-status').innerText = "All items sent successfully!";
            document.getElementById('file-label-btn').innerText = "Select File";
            filesQueue = [];
            document.getElementById('send-file-btn').disabled = true;
            return;
        }

        const file = filesQueue[currentFileIndex];
        const CHUNK_SIZE = 16384; 
        let offset = 0;
        const displayName = file.name;

        conn.send({
            type: 'file-meta',
            name: displayName,
            size: file.size,
            fileType: file.type
        });

        document.getElementById('transfer-status').innerText = `Sending [${currentFileIndex + 1}/${filesQueue.length}]: ${displayName} (0%)`;

        const reader = new FileReader();

        reader.onload = function(e) {
            if (!conn || !conn.open) return;
            conn.send(e.target.result);
            offset += e.target.result.byteLength;

            const progress = Math.min(100, Math.round((offset / file.size) * 100));
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('transfer-status').innerText = `Sending [${currentFileIndex + 1}/${filesQueue.length}]: ${displayName} (${progress}%)`;

            if (offset < file.size) {
                readNextChunk();
            } else {
                currentFileIndex++;
                setTimeout(sendNextFileInQueue, 200);
            }
        };

        function readNextChunk() {
            const slice = file.slice(offset, offset + CHUNK_SIZE);
            reader.readAsArrayBuffer(slice);
        }

        readNextChunk();
    }

    async function toggleCamera() {
        const camBtn = document.getElementById('cam-btn');
        if (!isCameraOn) {
            try {
                const videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, 
                    audio: true 
                });
                const audioTrack = localStream ? localStream.getAudioTracks()[0] : null;
                localStream = videoStream;
                if(audioTrack) localStream.addTrack(audioTrack);

                const localVideo = document.getElementById('local-video');
                localVideo.srcObject = localStream;
                localVideo.play();
                isCameraOn = true;
                camBtn.innerText = "Turn Off Cam";
                camBtn.classList.remove('active');
                document.getElementById('local-label').innerText = "My Camera";
                if (currentCall) updateStreamInCall();
            } catch (err) {
                alert('Camera access denied or unavailable.');
            }
        } else {
            // Stop the physical camera, but keep the audio track alive.
            if (localStream) {
                localStream.getVideoTracks().forEach(track => track.stop());
            }

            // Show a black/off state locally instead of leaving the last frame.
            const localVideo = document.getElementById('local-video');
            localVideo.pause();
            localVideo.srcObject = null;

            isCameraOn = false;
            camBtn.innerText = "Turn On Cam";
            camBtn.classList.add('active');
            document.getElementById('local-label').innerText = "My Camera (Off)";

            // IMPORTANT: send a live black track to the partner.
            // Sending null can make some browsers keep displaying the last frame.
            if (currentCall) updateStreamInCall();
        }
    }

    async function switchCamera() {
        if (!isCameraOn) return;
        usingFrontCamera = !usingFrontCamera;
        localStream.getVideoTracks().forEach(track => track.stop());
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, 
                audio: true 
            });
            const audioTrack = localStream.getAudioTracks()[0];
            if(audioTrack) newStream.addTrack(audioTrack);
            localStream = newStream;
            
            const localVideo = document.getElementById('local-video');
            localVideo.srcObject = localStream;
            localVideo.play();
            if (currentCall) updateStreamInCall();
        } catch (err) {
            alert('Could not switch camera.');
        }
    }

    // Creates a real black video track. This prevents the partner's
    // <video> element from freezing on the last camera frame when
    // the camera is turned off.
    function getBlackVideoTrack() {
        if (blackVideoTrack && blackVideoTrack.readyState === 'live') {
            return blackVideoTrack;
        }

        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 360;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const blackStream = canvas.captureStream(5);
        blackVideoTrack = blackStream.getVideoTracks()[0];
        return blackVideoTrack;
    }

    async function updateStreamInCall() {
        if (!currentCall || !currentCall.peerConnection) return;

        const senders = currentCall.peerConnection.getSenders();
        const videoSender = senders.find(s =>
            s.track && s.track.kind === 'video'
        );

        if (!videoSender) return;

        const videoTrack = isCameraOn && localStream
            ? localStream.getVideoTracks()[0]
            : getBlackVideoTrack();

        if (videoTrack) {
            try {
                await videoSender.replaceTrack(videoTrack);
            } catch (err) {
                console.error('Video track replace failed:', err);
            }
        }
    }

    function toggleMic() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        const micBtn = document.getElementById('mic-btn');
        if (audioTrack) {
            isMicMuted = !isMicMuted;
            audioTrack.enabled = !isMicMuted;
            micBtn.innerText = isMicMuted ? "Unmute" : "Mute Mic";
            micBtn.classList.toggle('active', isMicMuted);
        }
    }

    async function toggleSpeaker() {
        isLoudSpeaker = !isLoudSpeaker;
        const speakerBtn = document.getElementById('speaker-btn');
        const remoteVideo = document.getElementById('remote-video');
        const remoteAudio = document.getElementById('remote-audio');
        const activeMediaElement = (activeCallMode === 'video') ? remoteVideo : remoteAudio;
        
        activeMediaElement.volume = isLoudSpeaker ? 1.0 : 0.35;
        if (isLoudSpeaker) {
            speakerBtn.innerText = "Speaker: Loud";
            speakerBtn.classList.remove('speaker-normal');
        } else {
            speakerBtn.innerText = isMobileDevice ? "Speaker: Ear" : "Speaker: Normal";
            speakerBtn.classList.add('speaker-normal');
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        if (conn && conn.open) {
            conn.send(message);
            appendMessage(message, 'outgoing');
            input.value = '';
        } else {
            alert('Not connected to any user yet!');
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendEmoji(emoji) {
        if (conn && conn.open) {
            conn.send({ type: 'emoji', emoji: emoji });
            triggerEmojiAnimation(emoji);
            appendMessage(`${emoji}`, 'outgoing');
        } else {
            alert('Not connected to any partner yet!');
        }
    }

    function triggerEmojiAnimation(emoji) {
        const overlay = document.getElementById('animation-overlay');
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'floating-emoji';
                el.innerText = emoji;
                el.style.left = Math.random() * 80 + 10 + 'vw';
                el.style.animationDuration = (3 + Math.random()) + 's';
                overlay.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }, i * 300);
        }
    }

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendFileDownloadMessage(fileName, fileUrl) {
        const chatBox = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message incoming`;
        
        msgDiv.innerHTML = `
            <div class="file-msg-box">
                <span>📁 Received: <b>${fileName}</b></span>
                <a class="file-download-btn" href="${fileUrl}" download="${fileName}">Download File</a>
            </div>
        `;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function triggerDisconnect(sendSignal = true) {
        if (sendSignal && conn && conn.open) {
            conn.send('__DISCONNECT__');
        }
        if (currentCall) {
            currentCall.close();
        }
        if (conn) {
            conn.close();
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }

        if (blackVideoTrack) {
            blackVideoTrack.stop();
            blackVideoTrack = null;
        }

        resetUIAfterDisconnect();
    }
</script>
